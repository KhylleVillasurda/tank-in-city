# Cloudflare named tunnel for Tank In City.
#
# Use this when you want a stable hostname instead of the random link a quick
# tunnel hands out. It needs a Cloudflare account and a domain on that account,
# so for a one-off session with friends prefer `web/scripts/share.sh`, which
# needs neither. See docs/sharing.md.
#
# Set it up once:
#
#   cloudflared tunnel login
#   cloudflared tunnel create tank-in-city
#   cloudflared tunnel route dns tank-in-city tank.example.com
#
# Then run it, from the repository root:
#
#   cloudflared tunnel --config deploy/cloudflared.yml run
#
# Fill in the tunnel UUID, the credentials path and the hostname below.
# `cloudflared tunnel list` prints the UUID; the credentials file is written next
# to it when you create the tunnel.

tunnel: a63139cd-784e-4bdf-aaf9-7c5a21960388
credentials-file: /home/REPLACE-WITH-YOUR-USER/.cloudflared/REPLACE-WITH-TUNNEL-UUID.json

# cloudflared keeps its own logs down here. It does not log request bodies, so it
# will not log a room password, but it does log every request path.
loglevel: info

ingress:
  # The game server's socket. It shares the hostname with the game on purpose:
  # the page then opens `wss://<its own host>/ws`, which needs no configuration
  # in the client and cannot be blocked as mixed content. A page served over
  # https is not allowed to open a plain `ws://` socket at all.
  #
  # Start it with: cd server && cargo run     (it listens on 127.0.0.1:8080)
  - hostname: tank.example.com
    path: /ws
    service: http://localhost:8080

  # The game itself. This is the link to send to friends.
  #
  # Start it with: cd web && npm run build && npm start
  - hostname: tank.example.com
    service: http://localhost:3000

  # cloudflared requires a catch-all last. Without it, a request that matches
  # neither rule above would fall through to the first one.
  - service: http_status:404
