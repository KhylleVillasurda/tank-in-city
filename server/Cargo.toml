[package]
name = "server"
version = "0.1.0"
edition = "2021"
description = "Tank In City server: rooms now, the authoritative match loop from Milestone 3 on."

[dependencies]
game-core = { path = "../game-core" }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
